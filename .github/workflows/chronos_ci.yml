# ===============================================================================
# MODULE MANIFEST: CHRONOS ENTERPRISE MLOPS PIPELINE (GITHUB ACTIONS)
# ===============================================================================
# System Purpose:
#     Serves as the automated CI/CD verification pipeline for the CHRONOS engine.
#     Provisions the runner environment, installs runtime dependencies, and
#     executes pre-flight environment checks alongside a 2-episode integration
#     smoke test to verify end-to-end pipeline integrity prior to merge.
#
# State Boundaries:
#     - Strictly manages the CI/CD lifecycle, workspace checkout, runtime setup,
#       and exit-status aggregation.
#     - Delegates all numerical operations, tensor transformations, and MDP state
#       transitions directly to the underlying Python execution layer.
#
# Mathematical/Physical Invariants:
#     1. Fail-Fast Exit Status Gate:
#        The workflow evaluates as a strict boolean gate: any non-zero exit code
#        emitted by unit tests or smoke training terminates the build immediately.
#     2. Bounded Smoke-Test Horizon:
#        The integration verification run is bounded to 2 complete episodes to
#        verify end-to-end gradient flow and tensor compatibility with minimal
#        CI runner overhead.
#
# Design Rationale:
#     Manual verification of deep reinforcement learning pipelines introduces
#     configuration drift and delayed failure detection. This declarative workflow
#     verifies that computational graphs compile, execute, and backpropagate
#     cleanly on every push and pull request.
# ===============================================================================

name: Chronos Intelligence Audit

# Branch & Pull Request Triggers:
# Executes continuous verification on pushes and pull requests targeting main
# or develop branches, preventing regressions from merging into production.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Runtime Verification & Smoke Validation
    # Runner Environment Provisioning:
    # Provisions a clean Linux runner instance for every workflow execution,
    # ensuring runtime isolation and eliminating host-specific environment drift.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workspace Assets
        uses: actions/checkout@v4

      - name: Set up Python 3.10 Runtime
        uses: actions/setup-python@v5
        with:
          # Python Runtime Pinning & Pip Caching:
          # Pins execution to Python 3.10 to ensure ABI compatibility across
          # TensorFlow, Gymnasium, and PySpark dependencies.
          python-version: "3.10"
          cache: "pip"

      - name: Install Enterprise Dependencies
        # Dependency Installation:
        # Upgrades core packaging utilities and installs the repository
        # dependency manifest alongside the pytest test runner.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Execute Pre-Flight Sanity Gate
        # Pre-Flight Unit & Environment Tests:
        # Executes environment and unit assertions prior to initializing tensor
        # graphs, catching mount issues or runtime mismatches early.
        run: |
          python -m pytest tests/ -v || python -m unittest discover -s src/ -p "test_*.py"

      - name: Run Chronos Intelligence Audit (Micro-Execution)
        # End-to-End Integration Smoke Test:
        # Executes the primary RL training loop over a bounded 2-episode horizon
        # to verify graph compilation, replay storage, and Bellman backpropagation.
        run: |
          python src/training_loop.py --episodes 2
