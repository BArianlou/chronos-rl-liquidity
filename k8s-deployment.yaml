# ===============================================================================
# MODULE MANIFEST: CHRONOS DISTRIBUTED COMPUTE TOPOLOGY (KUBERNETES)
# ===============================================================================
# System Purpose:
#     Serves as the distributed infrastructure orchestration layer for the CHRONOS engine.
#     Provisions the containerized compute cluster required to execute horizontal
#     PySpark feature transformations and RL inference pipelines at production scale.
#
# State Boundaries:
#     - Strictly manages container lifecycle states, cgroup resource allocation,
#       cluster networking, and replica topology.
#     - Delegates network stream consumption to ChronosKafkaConsumer and tensor
#       graph evaluation to the containerized Python/Java runtime.
#
# Mathematical/Physical Invariants:
#     1. High-Availability Quorum:
#        Replicas N >= 3 guarantees continuous partition consumption and quorum
#        availability during node eviction or rolling cluster upgrades.
#     2. Deterministic Resource Allocation:
#        Explicit memory (8Gi) and CPU (4 cores) limits prevent noisy-neighbor memory
#        contention and OOM cascades under heavy market tick volumes.
#     3. Partition Alignment Invariant:
#        Topic partition cardinality must satisfy P >= N (Replicas) to ensure
#        concurrent partition distribution across all deployed worker pods.
#
# Design Rationale:
#     High-frequency market microstructure feeds saturate single-node processing
#     architectures. This Kubernetes topology provides containerized horizontal
#     elasticity, isolating compute workloads and aligning physical memory boundaries
#     with distributed PySpark windowing and DQN execution requirements.
# ===============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-liquidity-engine
  # Namespace Isolation:
  # Isolates CHRONOS compute assets within the enterprise-mlops namespace,
  # enforcing physical network segmentation and role-based access control (RBAC).
  namespace: enterprise-mlops
  labels:
    app: chronos-rl
    tier: backend
spec:
  # High-Availability Replica Policy:
  # Deploys 3 concurrent worker pods. If an underlying physical node experiences
  # a hardware fault or network partition, adjacent replicas rebalance Kafka
  # partition assignments, preserving state ingestion continuity.
  replicas: 3
  selector:
    matchLabels:
      app: chronos-rl
  template:
    metadata:
      labels:
        app: chronos-rl
        tier: backend
    spec:
      # Ingress & Buffer Draining Grace Period:
      # Allows in-flight PySpark micro-batches and buffered Kafka records to flush
      # cleanly to persistence layers before SIGKILL during pod eviction.
      terminationGracePeriodSeconds: 60
      containers:
        - name: chronos-pyspark-worker
          image: barianlou/chronos-engine:v1.0.0
          imagePullPolicy: IfNotPresent

          # Cgroup Resource Envelope:
          # Sets container compute boundaries. The 4Gi request guarantees baseline
          # CPU/memory capacity on scheduled nodes, while the 8Gi limit accounts for
          # JVM heap space, Spark execution memory, and native off-heap network buffers.
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"

          env:
            # Distributed Execution Mode:
            # Configures the runtime container to register as an elastic Spark worker
            # node, participating in partitioned time-series window operations.
            - name: SPARK_MODE
              value: "worker"

            # Enterprise Message Broker Ingestion Endpoint:
            # Injects internal Kubernetes CoreDNS endpoints for the Kafka cluster,
            # establishing the streaming data link between the Java consumer
            # and the downstream feature transformation engines.
            - name: KAFKA_BROKER_URL
              value: "kafka-cluster.enterprise-mlops.svc.cluster.local:9092"

          # Operational Health & Readiness Probes:
          # Ensures degraded or stalled container states trigger automated pod restarts
          # without dropping active cluster orchestration state.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
